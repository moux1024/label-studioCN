worker_processes auto;
daemon off;
pid /tmp/nginx-proxy.pid;

events {
  worker_connections 1024;
}

http {
  ##
  # Temp folders
  ##
  proxy_temp_path /tmp/proxy_temp;
  client_body_temp_path /tmp/client_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  ##
  # Basic Settings
  ##
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  types_hash_max_size 2048;
  server_tokens off;

  ##
  # Logging Settings
  ##
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  # MIME
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  ##
  # Gzip Settings
  ##
  gzip            on;
  gzip_vary       on;
  gzip_proxied    any;
  gzip_comp_level 6;
  gzip_types      text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

  # Upstream definitions
  upstream service_3000 {
    server host.docker.internal:3000;
  }

  upstream label_studio {
    server nginx:8085;
  }

  server {
    listen 80;
    server_name _;

    client_max_body_size 200m;

    # Proxy to 3000 port service (root path)
    location / {
      proxy_pass http://service_3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
      proxy_connect_timeout 90;
      proxy_send_timeout 90;
      proxy_read_timeout 90;
      send_timeout 90;
    }

    # Proxy to Label Studio (subpath /label/)
    location /label/ {
      proxy_pass http://label_studio/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 90;
      proxy_send_timeout 90;
      proxy_read_timeout 90;
      send_timeout 90;
      proxy_redirect off;
      absolute_redirect off;
      
      # Preserve CORS headers from Label Studio
      proxy_pass_header Access-Control-Allow-Origin;
      proxy_pass_header Access-Control-Max-Age;
      proxy_pass_header Access-Control-Expose-Headers;
      proxy_pass_header Access-Control-Allow-Headers;
      
      # Rewrite redirects to include /label/ prefix
      proxy_redirect http://$host/ http://$host/label/;
      proxy_redirect https://$host/ https://$host/label/;
    }

    # Health check endpoint
    location /nginx_health {
      return 200 "OK";
      add_header Content-Type text/plain;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
      root   /usr/share/nginx/html;
    }
  }
}

